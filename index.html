<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreenBoard – Internes Nachhaltigkeits-Dashboard</title>
    <!-- CSS-Datei einbinden -->
    <link rel="stylesheet" href="style.css">
    <!-- Externe Bibliotheken für Diagramme und den Excel-Import -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
</head>
<body>

    <header>
        <div class="header-container">
            <h1>🌱 GreenBoard</h1>
            <p>Internes Nachhaltigkeits-Dashboard</p>
        </div>
    </header>

    <main class="dashboard-container">
        <!-- Datei-Upload-Bereich -->
        <section class="upload-section">
            <h2>Excel-Daten importieren</h2>
            <p class="hint">Die Daten werden zu 100 % lokal in deinem Browser verarbeitet.</p>
            <input type="file" id="excelFile" accept=".xlsx, .xls" />
        </section>

        <!-- Grid-Layout für die drei Diagramme -->
        <section class="charts-grid">
            <div class="chart-card">
                <h3>Anfahrt zur Arbeit</h3>
                <canvas id="mobilityChart"></canvas>
            </div>
            <div class="chart-card">
                <h3>Homeoffice-Tage pro Woche</h3>
                <canvas id="homeofficeChart"></canvas>
            </div>
            <div class="chart-card">
                <h3>Papierverbrauch (Seiten/Woche)</h3>
                <canvas id="paperChart"></canvas>
            </div>
        </section>
    </main>

    <footer>
        <p>Gemeinsam für eine grünere Zukunft. | BBBank Projektteam</p>
    </footer>

    <!-- JavaScript-Datei einbinden -->
    <script src="script.js"></script>
</body>
</html>
